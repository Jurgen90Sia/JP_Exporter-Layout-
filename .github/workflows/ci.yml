name: Validate foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ruby:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby: ['2.7', '3.2', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: gem install minitest -v 5.25.5 --no-document
      - run: ruby scripts/check_syntax.rb
      - run: ruby -Itest -e 'Dir["test/*_test.rb"].sort.each { |f| require File.expand_path(f) }'
  javascript-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node --check jp_exporter_layout/ui/preview.js
      - run: node --test test/ui_test.js
      - run: python scripts/validate_package.py
      - run: python scripts/static_check.py
      - run: python -m unittest discover -s test -p '*_test.py'
  independent-dxf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ezdxf==1.4.5
      - run: python -m unittest discover -s test -p 'dxf_reader_test.py'
  ruby-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install rubocop -v 1.39.0 --no-document
      - run: rubocop
